events {}

http {
    server {
        listen 80;

        # Config for Frontend
        location / {
            proxy_pass http://uitjobs-fe:3069;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Config for Backend 
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break; 
            proxy_pass http://uitjobs-be:4001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}